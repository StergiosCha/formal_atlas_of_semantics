services:
  checker:
    build:
      context: ..
      dockerfile: tool/checker/Dockerfile
    ports:
      - "8477:8477"
    environment:
      ATLAS_REPO: /atlas
      CHECK_TIMEOUT: "30"
      AZURE_AI_KEY: ${AZURE_AI_KEY}   # export before `docker compose up`
    volumes:
      - ../atlas_data/atlas.json:/atlas/atlas.json:ro
