name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

# Serialize each target; never interrupt an upload already in progress.
concurrency:
  group: atlas-site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'push' || github.event.action != 'closed'
    uses: ./.github/workflows/verify.yml

  reporting:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate provenance and reporting
        run: |
          python3 atlas_data/source_registry.py
          python3 -m unittest discover -s atlas_data -p 'test_*.py'
          python3 -m unittest discover -s tool/llm -p 'test_*.py'
          python3 atlas_data/consolidate.py
          git diff --exit-code -- atlas_data/atlas.json atlas_data/ATLAS.md
          python3 atlas_data/build_site.py
          node atlas_data/site/test_landing.cjs
          node atlas_data/site/test_source_registry.cjs
          node atlas_data/site/test_claim_comparison.cjs
          node atlas_data/site/test_rosch_campaign.cjs
          node atlas_data/site/test_outcomes.cjs
          node atlas_data/site/test_proofs.cjs
          node atlas_data/site/test_edge_profiles.cjs

  build_and_deploy_job:
    needs: [verify, reporting]
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Confirm current production revision
        if: github.event_name == 'push'
        id: current
        uses: actions/github-script@v7
        with:
          script: |
            const ref = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
            return ref.data.object.sha === context.sha;
      - name: Build verified site
        run: python3 atlas_data/build_site.py
      - name: Build And Deploy
        if: github.event_name != 'push' || steps.current.outputs.result == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_BEACH_0C447E210 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: atlas_data/site
          api_location: ''
          output_location: ''
          skip_app_build: true

  close_pull_request_job:
    if: >-
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ORANGE_BEACH_0C447E210 }}
          action: close
