services:
  checker:
    build:
      context: ..
      dockerfile: tool/checker/Dockerfile
    ports:
      - "8477:8477"
    environment:
      ATLAS_REPO: /atlas
      CHECK_TIMEOUT: "30"
    # Mount the consolidated data for GET /atlas (regenerate with
    # consolidate.py in the formalizing folder and copy here, or point
    # ATLAS_JSON at a mounted volume):
    volumes:
      - ../atlas.json:/atlas/atlas.json:ro
