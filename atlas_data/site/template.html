<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formalizing Formal Semantics — A Coq-verified Atlas of Semantic Structures</title>
<meta name="description" content="An atlas of semantic theories, machine-checked in Coq. Every theory is a module; every relation between theories is a graded, evidenced edge.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5EF; --ink:#1E2B1E; --accent:#4E8C3B; --accent-500:#6FAB55;
  --accent-300:#BFD8AB; --accent-700:#2F5F27; --accent-900:#163216;
  --n400:#B9C4B5; --n700:#5C6B5A; --rust:#A64B3A;
  --rule:2px solid var(--ink); --hair:1px solid var(--n400);
  --mono:"JuliaMono","Iosevka","DejaVu Sans Mono",Menlo,monospace;
  --sans:"Archivo",system-ui,-apple-system,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;border-radius:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.mono{font-family:var(--mono);font-size:.9em}
.kicker{font:600 13px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--accent-700)}
h1,h2,h3{letter-spacing:-.02em;line-height:1.06;font-weight:800}
h1{font-size:clamp(38px,5.4vw,68px)}
h2{font-size:clamp(26px,3.2vw,38px)}
h3{font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
p{max-width:62ch}
.dim{color:var(--n700)}
.small{font-size:14px}
.tiny{font-size:12.5px}

/* header */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:var(--rule)}
.hd{display:flex;align-items:center;gap:20px;height:60px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em;font-size:17px}
.brand img{width:26px;height:26px;display:block}
nav{margin-left:auto;display:flex;gap:26px;align-items:center}
nav a{font-size:14px;font-weight:600;color:var(--n700);padding:4px 0;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--ink);border-bottom-color:var(--accent)}
select{font:600 13px Archivo;color:var(--ink);background:var(--bg);border:2px solid var(--ink);border-radius:0;padding:6px 8px}
textarea:focus,select:focus,input:focus{outline:2px solid var(--accent);outline-offset:0}
.btn{display:inline-block;background:var(--accent);color:#fff;font:600 14px/1 var(--sans);
  padding:11px 18px;border:2px solid var(--accent);cursor:pointer;text-align:left}
.btn:hover{background:var(--accent-700);border-color:var(--accent-700)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:var(--bg)}

/* hero */
.hero{padding:76px 0 52px}
.herogrid{display:grid;grid-template-columns:1fr 300px;gap:56px;align-items:center}
.heromark{width:100%;height:auto;display:block}
.hero h1{margin:18px 0 22px;max-width:15ch}
.hero p{font-size:17px;color:var(--n700);max-width:60ch}
.cta{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;border-top:var(--rule);margin-top:52px;padding-top:24px}
.stat b{display:block;font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat span{display:block;font:600 11.5px/1.35 var(--sans);text-transform:uppercase;letter-spacing:.07em;color:var(--n700);margin-top:8px}

/* generic section */
section{padding:56px 0}
.sechead{display:flex;align-items:baseline;gap:20px;border-bottom:var(--rule);padding-bottom:14px;margin-bottom:28px;flex-wrap:wrap}
.sechead h2{flex:0 0 auto}
.sechead .note{margin-left:auto;font-size:14px;color:var(--n700);max-width:46ch}

/* plate */
.plate{border:var(--rule);background:#FBFAF6;position:relative}
.plate svg{display:block;width:100%;height:auto}
.plate .cap{border-top:var(--hair);padding:10px 16px;display:flex;gap:14px;align-items:center;
  font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.08em;color:var(--n700)}
.node rect{fill:var(--bg);stroke:var(--ink);stroke-width:2;cursor:pointer}
.node:hover rect{fill:var(--accent-300)}
.node .nm{font:600 12.5px var(--sans);fill:var(--ink);pointer-events:none}
.node .nt{font:11px var(--mono);fill:var(--n700);pointer-events:none}
.node.pre rect{stroke-dasharray:5 4;stroke:var(--n700)}
.edge{fill:none;stroke:var(--ink);cursor:pointer}
.edge:hover{stroke:var(--accent)}
.etag rect{fill:var(--accent);stroke:none}
.etag text{font:600 10px var(--sans);fill:#fff}
.grat{stroke:var(--n400);stroke-width:.6;opacity:.5;fill:none}

/* grid of cards */
.grid{display:grid;gap:0;border-top:var(--rule);border-left:var(--rule)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{border-right:var(--rule);border-bottom:var(--rule);padding:20px;display:flex;flex-direction:column;gap:9px;min-height:150px;background:var(--bg)}
a.card:hover{background:#EFEEE6}
.card .top{display:flex;align-items:center;gap:9px}
.card h3{flex:1}
.card p{font-size:13.5px;color:var(--n700);max-width:none}
.card .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:8px}

/* badges */
.b{display:inline-block;font:600 10.5px/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;
  padding:5px 7px;border:1px solid var(--ink)}
.b.ok{background:var(--accent);color:#fff;border-color:var(--accent)}
.b.mid{background:var(--accent-300);border-color:var(--accent-700);color:var(--accent-900)}
.b.bad{background:var(--rust);color:#fff;border-color:var(--rust)}
.b.q{background:transparent;color:var(--n700);border-color:var(--n400)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font:600 11px/1 var(--sans);text-transform:uppercase;letter-spacing:.07em;
  color:var(--n700);padding:0 12px 10px 0;border-bottom:var(--rule)}
td{padding:12px 12px 12px 0;border-bottom:var(--hair);vertical-align:top}
tr:hover td{background:#EFEEE6}
td a:hover{color:var(--accent-700);text-decoration:underline;text-underline-offset:3px}
td.n{white-space:nowrap;width:1%}

/* record page */
.rec{display:grid;grid-template-columns:1fr 320px;gap:40px;align-items:start}
.side{border:var(--rule);padding:20px;position:sticky;top:80px;display:flex;flex-direction:column;gap:16px}
.side dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.side dt{font-weight:600;color:var(--n700)}
.block{margin:34px 0}
.block>h3{border-bottom:var(--rule);padding-bottom:10px;margin-bottom:16px}
.gap{border:2px solid var(--rust);padding:18px;background:#FBF2F0}
.gap .kicker{color:var(--rust)}
ul.tick{list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px}
ul.tick li{padding-left:18px;position:relative;max-width:70ch}
ul.tick li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:2px;background:var(--accent)}
ul.tick.neg li::before{background:var(--rust)}

/* ladder */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-left:var(--rule);border-top:var(--rule)}
.rung{border-right:var(--rule);border-bottom:var(--rule);padding:16px}
.rung b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em}
.rung span{display:block;font:600 10.5px/1.3 var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--n700);margin-top:6px}
.rung .bar{height:6px;margin-top:12px;background:var(--n400)}

/* controls */
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;align-items:center}
input[type=search],select{font:400 14px var(--sans);padding:10px 12px;border:2px solid var(--ink);
  background:var(--bg);color:var(--ink);min-width:200px}
input[type=search]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.chip{font:600 12px/1 var(--sans);padding:8px 10px;border:2px solid var(--n400);color:var(--n700);cursor:pointer;background:none}
.chip.on{border-color:var(--accent);background:var(--accent);color:#fff}

/* emblem strip */
.embs{display:grid;grid-template-columns:repeat(7,1fr);border-top:var(--rule);border-left:var(--rule)}
.emb{border-right:var(--rule);border-bottom:var(--rule);padding:16px;text-align:left}
.emb img{width:34px;height:34px;display:block;margin-bottom:10px}
a.emb:hover{background:#EFEEE6}
.emb b{font-size:12.5px;font-weight:600;display:block;line-height:1.25}
.emb span{font-size:11px;color:var(--n700)}

/* band + footer */
.band{background:var(--accent);color:#fff;padding:64px 0;margin-top:56px}
.band h2{max-width:18ch}
.band .btn{background:#fff;color:var(--accent-900);border-color:#fff;margin-top:24px}
footer{border-top:var(--rule);padding:22px 0;display:flex;gap:20px;font-size:13px;color:var(--n700);flex-wrap:wrap}
footer .r{margin-left:auto}
.crumb{font-size:13px;color:var(--n700);padding:22px 0 0}
.crumb a:hover{color:var(--accent)}
.empty{padding:44px 0;color:var(--n700)}
@media(max-width:1000px){
  .herogrid{grid-template-columns:1fr}.heromark{display:none}
  .rec{grid-template-columns:1fr}.side{position:static}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .ladder{grid-template-columns:repeat(3,1fr)}
  .embs{grid-template-columns:repeat(4,1fr)}
}
@media(max-width:640px){
  .wrap{padding:0 18px}.g3,.g4,.embs{grid-template-columns:1fr}
  nav{gap:14px}nav a{font-size:13px}.hd{height:auto;padding:10px 0;flex-wrap:wrap}
}
</style>
</head>
<body>
<header><div class="wrap hd">
  <a class="brand" href="#/">
    <img src="assets/svg/mark-a-meridian.svg" alt="" width="26" height="26">Formal Atlas</a>
  <nav id="nav">
    <a href="#/plate" data-r="plate">Plate</a>
    <a href="#/theories" data-r="theories">Theories</a>
    <a href="#/edges" data-r="edges">Edges</a>
    <a href="#/papers" data-r="papers">Papers</a>
    <a href="#/check" data-r="check">Verifier</a>
    <a class="btn" href="#/plate">Open the atlas</a>
  </nav>
</div></header>

<main id="app"></main>
<noscript><div class="wrap" style="padding:64px 0">
  <h2>The atlas needs JavaScript.</h2>
  <p style="margin-top:14px">Every page here is rendered from the audit records in
  <span class="mono">atlas.json</span>. The underlying Coq sources and JSON records are in the
  repository and need no browser at all.</p></div></noscript>

<footer><div class="wrap" style="display:flex;gap:20px;width:100%;flex-wrap:wrap">
  <span>Formalizing Formal Semantics — a Coq-verified atlas of semantic structures</span>
  <span class="r">Generated __GENERATED__ · zero <span class="mono">Admitted</span> in the atlas layer</span>
</div></footer>

<script id="atlas-data" type="application/json">__ATLAS_DATA__</script>
<script>
const D = JSON.parse(document.getElementById('atlas-data').textContent);
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- theory metadata: display names + the notation on each plate ---------- */
const META = {
  atlas__ptq:      ['Montague PTQ','λP.P{j}','montague'],
  atlas__lambek:   ['Lambek calculus','np, np\\s ⊢ s','typelogical'],
  atlas__discocat: ['DisCoCat','n·nʳ·s·nˡ·n → s','categorical'],
  atlas__mtt:      ['MTT (Chatzikyriakidis & Luo)','man : CN','mtt'],
  atlas__ranta:    ['Ranta TTG','Σx:man. walk x','mtt'],
  atlas__dts:      ['DTS (Bekki)','@ : (x:e) → …','mtt'],
  atlas__inqb:     ['Inquisitive InqB','!P ∩ ?P','inquisitive'],
  atlas__dpl:      ['DPL','⟦φ⟧ ⊆ G × G','dynamic'],
  atlas__rsa:      ['RSA','L₁(w|u) ∝ S₁(u|w)P(w)','probabilistic'],
  shallow__kratzer2:      ['Kratzer modality','⋂f(w) ≤g …','montague'],
  extras__BarwiseCooper:  ['Barwise & Cooper','conservativity','montague'],
};
/* records outside the atlas layer carry an absolute path; show it repo-relative */
const shortPath = p => String(p||'').replace(/^.*\/revisiting-formal-semantics\//,'');
const REGION_NAME = {montague:'Montague',typelogical:'Type-logical',mtt:'Modern type theory',
  dynamic:'Dynamic',inquisitive:'Inquisitive',probabilistic:'Probabilistic',categorical:'Categorical'};
const REGION_ORDER = ['montague','typelogical','categorical','mtt','dynamic','inquisitive','probabilistic'];
const REGION_BLURB = {
  montague:'Truth conditions in a model, meanings as functions.',
  typelogical:'Syntax is a proof; the derivation *is* the composition.',
  categorical:'Grammar and vector meaning in one compact closed category.',
  mtt:'Types carry the ontology, so proofs carry the entailments.',
  dynamic:'Meaning is a change in the context, not a set of worlds.',
  inquisitive:'One semantics for what is said and what is asked.',
  probabilistic:'Interpretation as recursive reasoning under uncertainty.',
};

const byKey = {}; D.files.forEach(f=>byKey[f.key]=f);
const edges = D.edges||[];
/* a node is an atlas theory file (not a *_vs_* bridge), plus any edge endpoint we hold a record for */
const endpoints = new Set(); edges.forEach(e=>{endpoints.add(e.a);endpoints.add(e.b);});
const nodes = D.files.filter(f=>{
  if(!f.key || /_vs_/.test(f.key)) return false;
  return (f.file||'').startsWith('atlas/') || endpoints.has(f.key);
});
const bridges = D.files.filter(f=>/_vs_/.test(f.key||''));
const nodeKeys = new Set(nodes.map(n=>n.key));
const liveEdges = edges.filter(e=>nodeKeys.has(e.a)&&nodeKeys.has(e.b));
const name = k => (META[k]||[])[0] || (k||'').replace(/^atlas__/,'').toUpperCase();
const nota = k => (META[k]||[])[1] || '';
const rgn  = k => (META[k]||[])[2] || null;
const shortName = k => name(k).replace(/\s*\(.*\)\s*$/,'');
const inRegion = r => nodes.concat(bridges).filter(f=>{
  if(rgn(f.key)===r) return true;
  if(!/_vs_/.test(f.key||'')) return false;
  return (f.sources||[]).length && [f.key.replace(/^atlas__/,'').split('_vs_')[0],
    f.key.split('_vs_')[1]].some(s=>rgn('atlas__'+s)===r);
});
const totals = {
  theories: nodes.length, edges: edges.length, bridges: bridges.length,
  theorems: (D.stats&&D.stats.theorems)||0, admitted:(D.stats&&D.stats.admitted)||0,
  records: D.files.length, papers: D.papers.length,
  formalized: D.papers.filter(p=>['F4','F5'].includes(p.level)).length,
  atlasAdmitted: D.files.filter(f=>(f.file||'').startsWith('atlas/'))
                        .reduce((s,f)=>s+((f.counts||{}).admitted||0),0),
};

/* ---------- Plate I : deterministic layout, no dependencies ---------- */
function boxOf(k){
  const nm=name(k), nt=nota(k);
  return {w:Math.max(nm.length*7.1, nt.length*6.6)+30, h:nt?46:32};
}
/* Composed placement, in fractions of the graph field. An atlas plate is drawn,
   not simulated: these were laid out so no edge crosses another and the four
   families read left-to-right. Keys absent here fall back to a ring. */
const POS = {
  atlas__discocat:       [0.16,0.15],
  atlas__lambek:         [0.42,0.15],
  shallow__kratzer2:     [0.10,0.52],
  atlas__ptq:            [0.38,0.52],
  atlas__mtt:            [0.66,0.52],
  atlas__ranta:          [0.89,0.26],
  atlas__dts:            [0.88,0.80],
  extras__BarwiseCooper: [0.20,0.88],
};
function plateSVG(W=1180,H=700){
  const linked=new Set(); liveEdges.forEach(e=>{linked.add(e.a);linked.add(e.b);});
  const mapped = nodes.filter(n=>linked.has(n.key));
  const loose  = nodes.filter(n=>!linked.has(n.key));
  const REG = loose.length ? 104 : 0;           /* bottom register height */
  const Hg = H - REG;
  const P={}; let ring=0;
  mapped.forEach(n=>{
    const f=POS[n.key];
    if(f){ P[n.key]={x:f[0]*W, y:f[1]*Hg}; }
    else { const a=(ring++/Math.max(1,mapped.length))*Math.PI*2;
           P[n.key]={x:W/2+Math.cos(a)*W*0.33, y:Hg/2+Math.sin(a)*Hg*0.33}; }
  });

  let g='';
  for(let x=0;x<=W;x+=74) g+=`<path class="grat" d="M${x} 0 V${Hg}"/>`;
  for(let y=0;y<=Hg;y+=74) g+=`<path class="grat" d="M0 ${y} H${W}"/>`;
  for(let r=1;r<=3;r++)                                  /* latitude arcs */
    g+=`<path class="grat" d="M0 ${Hg*0.5+r*66} Q ${W*0.5} ${Hg*0.5-r*30} ${W} ${Hg*0.5+r*66}"/>`;

  let e='';
  liveEdges.forEach(ed=>{
    const a=P[ed.a], b=P[ed.b], c=ed._computed||{};
    const sim=c.similarity||0, ov=c.overlap||0;
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const bow=Math.min(46,len*0.10);                      /* gentle meridian bow */
    const mx=(a.x+b.x)/2 - (dy/len)*bow, my=(a.y+b.y)/2 + (dx/len)*bow;
    const w=Math.max(1.2,(sim/5)*5.4), op=0.34+ov*0.58;
    e+=`<g><path class="edge" d="M${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}"
        stroke-width="${w.toFixed(2)}" stroke-opacity="${op.toFixed(2)}"
        ${sim<3?'stroke-dasharray="7 5"':''}
        onclick="go('#/edge/${ed._key}')"><title>${esc(name(ed.a))} ↔ ${esc(name(ed.b))} — similarity ${sim}, overlap ${ov}</title></path>`;
    const tx=(a.x+b.x)/2-(dy/len)*bow*0.5, ty=(a.y+b.y)/2+(dx/len)*bow*0.5;
    e+=`<g class="etag" onclick="go('#/edge/${ed._key}')" style="cursor:pointer">
        <rect x="${(tx-16).toFixed(1)}" y="${(ty-8).toFixed(1)}" width="32" height="16"/>
        <text x="${tx.toFixed(1)}" y="${(ty+4).toFixed(1)}" text-anchor="middle">${sim.toFixed(1)}</text>
        <title>similarity ${sim} — mean grade over ${c.joint_phenomena} joint phenomena</title></g></g>`;
  });

  const plateOf = (k,x,y,file) => {
    const nm=name(k), nt=nota(k), {w,h}=boxOf(k);
    const pre=!(file||'').startsWith('atlas/');
    return `<g class="node ${pre?'pre':''}" onclick="go('#/theory/${k}')">
      <rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}"/>
      <text class="nm" x="${x.toFixed(1)}" y="${(y+(nt?-4:4)).toFixed(1)}" text-anchor="middle">${esc(nm)}</text>
      ${nt?`<text class="nt" x="${x.toFixed(1)}" y="${(y+13).toFixed(1)}" text-anchor="middle">${esc(nt)}</text>`:''}
      <title>${esc(nm)}${pre?' — pre-atlas record, still uses Parameters':''}</title></g>`;
  };
  let nd=''; mapped.forEach(n=>{const p=P[n.key]; nd+=plateOf(n.key,p.x,p.y,n.file);});

  /* the honest bottom register: formalized, but not yet related to anything */
  let reg='';
  if(loose.length){
    const ws=loose.map(n=>boxOf(n.key).w), tot=ws.reduce((a,b)=>a+b,0);
    const gap=(W-64-tot)/(loose.length+1);
    let x=32+gap;
    reg+=`<path d="M0 ${Hg} H${W}" stroke="#1E2B1E" stroke-width="2"/>
      <text x="16" y="${Hg+26}" style="font:600 11px Archivo;letter-spacing:.08em;fill:#5C6B5A">FORMALIZED · NO GRADED EDGE YET</text>`;
    loose.forEach((n,i)=>{ reg+=plateOf(n.key, x+ws[i]/2, Hg+66, n.file); x+=ws[i]+gap; });
  }

  const lg=`<g transform="translate(${(W*0.42).toFixed(0)},${(Hg-108).toFixed(0)})">
    <rect x="0" y="0" width="220" height="100" fill="#FBFAF6" stroke="#1E2B1E" stroke-width="2"/>
    <text x="12" y="21" style="font:600 10px Archivo;letter-spacing:.08em;fill:#5C6B5A">LEGEND</text>
    <path d="M12 37 H72" stroke="#1E2B1E" stroke-width="5.4" stroke-opacity="0.92"/>
    <text x="80" y="41" style="font:11px Archivo;fill:#1E2B1E">5·0 definitional</text>
    <path d="M12 57 H72" stroke="#1E2B1E" stroke-width="3.2" stroke-opacity="0.6"/>
    <text x="80" y="61" style="font:11px Archivo;fill:#1E2B1E">3·0 one-way / mediated</text>
    <rect x="12" y="71" width="28" height="14" fill="#4E8C3B"/>
    <text x="48" y="82" style="font:11px Archivo;fill:#1E2B1E">measured similarity</text></g>`;

  return `<svg viewBox="0 0 ${W} ${H}" role="img"
    aria-label="Plate I — ${mapped.length} theories joined by ${liveEdges.length} graded edges">${g}${e}${lg}${nd}${reg}</svg>`;

function faithB(v){const m={'faithful':'ok','faithful-with-corrections':'ok','partial':'mid','unfaithful':'bad'};
  return v?`<span class="b ${m[v]||'q'}">${esc(v)}</span>`:'';}
function detB(v){const m={'as_is':'ok','slight_modification':'mid','major_restructuring':'bad'};
  return v?`<span class="b ${m[v]||'q'}">${esc(String(v).replace(/_/g,' '))}</span>`:'';}
function countsB(c){ if(!c) return '';
  const t=c.theorems||0, ad=c.admitted||0;
  return `<span class="b ${ad?'bad':'ok'}">${t} thm · ${ad} admitted</span>`;}

        `<button class="chip ${lvl===l?'on':''}" onclick="go('#/papers?level=${l}')">${l} · ${LAB[l]}</button>`).join('')}
    </div>
    <table><thead><tr><th class="n">Level</th><th>Paper</th><th>Topic</th><th class="n">Coq</th></tr></thead>
    <tbody id="prows">${D.papers.filter(p=>!lvl||p.level===lvl).map(p=>{
      const files=(p.coq_present||p.coq_files||[]);
      return `<tr data-s="${esc((p.citation+' '+p.topic+' '+(p.title||'')).toLowerCase())}">
      <td class="n"><span class="b ${p.level>='F4'?'ok':p.level>='F2'?'mid':'q'}">${esc(p.level||'')}</span></td>
      <td>${esc(p.citation)}${p.prediction_disputed?'<span class="b bad" style="margin-left:8px">survey call disputed</span>':''}</td>
      <td class="small dim">${esc(p.topic)}</td>
      <td class="n mono tiny">${files.length?files.map(f=>esc(f.split('/').pop())).join('<br>'):'—'}</td></tr>`;}).join('')}
    </tbody></table></section></div>`;
}
function pFilter(){const v=$('#pq').value.toLowerCase();
  document.querySelectorAll('#prows tr').forEach(r=>r.style.display=!v||r.dataset.s.includes(v)?'':'none');}

function notFound(){return `<div class="wrap empty"><h2>Not on the map.</h2>
  <p style="margin-top:12px"><a class="btn" href="#/" style="margin-top:16px">Back to the atlas</a></p></div>`;}

/* ---------- router ---------- */
function go(h){location.hash=h;}
/* ---- the verifier (B4): the model drafts, coqc disposes ---- */
const CHECK_THEORIES=[
  ['montague.PTQ','Montague PTQ'],['dynamic.DPL','DPL'],
  ['inquisitive.InqB','Inquisitive InqB'],['mtt_ranta.MTT','MTT'],
  ['mtt_ranta.Ranta','Ranta TTG'],['mtt_ranta.DTS','DTS'],
  ['probabilistic.RSA','RSA'],['categorical.DisCoCat','DisCoCat'],
  ['type_logical.Lambek','Lambek'],
];
const api=()=>localStorage.getItem('atlas_api')||'http://localhost:8477';
function vCheck(){
  return `<div class="wrap"><div class="crumb"><a href="#/">Atlas</a> / Verifier</div>
  <section style="padding-top:24px">
    <div class="sechead"><h2>Check a claim against a theory</h2>
      <span class="note">You state it in English. A model of your choice drafts the Coq.
      The compiler decides — every verdict below is coqc's, never the model's.</span></div>
    <div class="grid g2" style="align-items:start">
      <div>
        <span class="kicker">The claim</span>
        <textarea id="ck-claim" rows="5" style="width:100%;margin-top:10px;border:2px solid var(--ink);
          background:var(--bg);font:15px/1.5 Archivo;padding:12px;resize:vertical"
          placeholder="e.g. In DPL, a doubly negated existential no longer binds a later pronoun."></textarea>
        <div style="display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;align-items:end">
          <label class="tiny dim">Theory<br>
            <select id="ck-theory" style="margin-top:4px">${CHECK_THEORIES.map(t=>
              `<option value="${t[0]}">${t[1]}</option>`).join('')}</select></label>
          <label class="tiny dim">Model<br>
            <select id="ck-model" style="margin-top:4px"><option value="">loading…</option></select></label>
          <label class="tiny dim">Feedback<br>
            <select id="ck-arm" style="margin-top:4px">
              <option value="typed">typed (default)</option>
              <option value="raw">raw stderr</option>
              <option value="none">none</option></select></label>
          <button class="btn" id="ck-go" onclick="runCheck()">Draft &amp; check</button>
        </div>
        <p class="tiny dim" style="margin-top:10px">Backend
          <input id="ck-api" value="${esc(api())}" style="width:280px;border:0;border-bottom:2px solid var(--n400);
            background:transparent;font:12px ui-monospace,monospace"
          onchange="localStorage.setItem('atlas_api',this.value);loadModels()"> · rate-limited · identical requests are cached</p>
      </div>
      <div id="ck-out"><span class="kicker">Verdict</span>
        <p class="tiny dim" style="margin-top:10px">Nothing checked yet. The four buckets:
        <b>proved</b> (with its assumptions audit), <b>refuted</b> (with the countermodel),
        <b>needs assumption</b> (named), <b>not statable</b> (with the reason the vocabulary
        cannot express it).</p></div>
    </div></section></div>`;
}
async function loadModels(attempt=1){
  const sel=document.getElementById('ck-model'); if(!sel) return;
  /* the backend scales to zero; the first fetch often lands mid-wake, so
     retry with backoff instead of giving up on a cold start */
  try{
    const r=await fetch(api()+'/models'); if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    sel.innerHTML=j.models.map(m=>`<option value="${m.deployment}"${m.deployment===j.default?' selected':''}>
      ${m.deployment} (${m.family})</option>`).join('');
  }catch(e){
    if(attempt<8 && document.getElementById('ck-model')===sel){
      sel.innerHTML=`<option value="">waking backend… (try ${attempt}/8)</option>`;
      setTimeout(()=>loadModels(attempt+1), 6000*Math.min(attempt,3));
    }else sel.innerHTML='<option value="">backend offline — check the Backend URL below</option>';
  }
}
async function runCheck(){
  const out=document.getElementById('ck-out'), btn=document.getElementById('ck-go');
  const claim=document.getElementById('ck-claim').value.trim();
  if(!claim){out.innerHTML='<span class="kicker" style="color:var(--rust)">Verdict</span><p class="tiny" style="margin-top:10px">Write the claim first.</p>';return;}
  btn.disabled=true;
  out.innerHTML='<span class="kicker">Verdict</span><p class="tiny dim" style="margin-top:10px">Drafting and compiling — up to a few minutes for reasoning models…</p>';
  try{
    const r=await fetch(api()+'/verify',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({claim, model:document.getElementById('ck-model').value,
        imports:[document.getElementById('ck-theory').value],
        feedback:document.getElementById('ck-arm').value})});
    const j=await r.json();
    if(j.error&&!j.bucket){out.innerHTML=`<span class="kicker" style="color:var(--rust)">Verdict</span>
      <p class="tiny" style="margin-top:10px">${esc(j.error)}</p>`;return;}
    const b=j.bucket||'?';
    const cls=/^PROVED$/.test(b)?'ok':/REFUTED/.test(b)?'bad':/UNVERIFIED|NOT_STATED/.test(b)?'q':'mid';
    out.innerHTML=`<span class="kicker">Verdict — coqc's, not the model's</span>
      <div style="margin-top:10px"><span class="b ${cls}">${esc(b.replaceAll('_',' ').toLowerCase())}</span>
        <span class="tiny dim"> · ${esc(j.model)} · ${j.rounds} round${j.rounds>1?'s':''}${j.cached?' · cached':''}</span></div>
      ${Object.keys(j.audit||{}).length?`<table style="margin-top:12px"><thead><tr><th>Audited theorem</th><th class="n">Assumptions</th></tr></thead>
        <tbody>${Object.entries(j.audit).map(([k,v])=>`<tr><td class="mono tiny">${esc(k)}</td>
        <td class="n"><span class="b ${v==='closed'?'ok':'q'}">${esc(v)}</span></td></tr>`).join('')}</tbody></table>`:''}
      ${j.code?`<div style="margin-top:12px"><span class="kicker">The Coq the compiler accepted</span>
        <pre class="mono tiny" style="margin-top:8px;border-left:2px solid var(--n400);padding:10px 14px;overflow:auto;max-height:340px">${esc(j.code)}</pre></div>`:''}
      ${j.notes?`<p class="tiny dim" style="margin-top:10px;max-width:none">${esc(j.notes)}</p>`:''}
      ${(j.turns||[]).some(t=>t.signals&&t.signals.length)?`<p class="tiny dim" style="margin-top:8px">Repair signals along the way:
        ${j.turns.flatMap(t=>t.signals.map(s=>s.kind)).join(', ')}</p>`:''}`;
  }catch(e){out.innerHTML=`<span class="kicker" style="color:var(--rust)">Verdict</span>
    <p class="tiny" style="margin-top:10px">Backend unreachable at <span class="mono">${esc(api())}</span>.
    Start it: <span class="mono">docker compose -f tool/docker-compose.yml up</span>, or point the field above at the deployed URL.</p>`;}
  finally{btn.disabled=false;}
}

function route(){
  const raw=(location.hash||'#/').slice(1);
  const [path,qs]=raw.split('?');
  const q={}; (qs||'').split('&').filter(Boolean).forEach(kv=>{const [k,v]=kv.split('=');q[k]=decodeURIComponent(v||'');});
  const seg=path.split('/').filter(Boolean);
  let html, tab=seg[0]||'';
  if(!seg.length) html=vHome();
  else if(seg[0]==='plate') html=vPlate();
  else if(seg[0]==='theories') html=vTheories();
  else if(seg[0]==='theory') {html=vTheory(seg[1]); tab='theories';}
  else if(seg[0]==='edges') html=vEdges();
  else if(seg[0]==='edge') {html=vEdge(seg[1]); tab='edges';}
  else if(seg[0]==='region') {html=vRegion(seg[1]); tab='';}
  else if(seg[0]==='papers') html=vPapers(q);
  else if(seg[0]==='check') html=vCheck();
  else html=notFound();
  $('#app').innerHTML=html;
  if(seg[0]==='check') loadModels();
  document.querySelectorAll('#nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===tab));
  window.scrollTo(0,0);
}
addEventListener('hashchange',route); route();
</script>
</body>
</html>
